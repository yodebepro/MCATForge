<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MCAT Block Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style><script src="config.js"></script><script>window.MBT_SERVER = !!window.MBT_API;</script></head><body>
<style>
/* Layout: one focused study column (max 820px); during a quiz, passage and question sit side by side on wide screens like the real exam. */
:root{
  --scale:1;
  --bg:#EEF2F5; --surface:#FFFFFF; --sunk:#E3E9EE; --fg:#13202B; --muted:#55687A; --line:#D3DCE4;
  --ink:#0E5566; --ink-fg:#FFFFFF; --hl:#F4D547; --hl-fg:#1C1A0A;
  --ok:#1D7A4B; --ok-bg:#E1F2E8; --bad:#B4362D; --bad-bg:#F8E3E1; --warn:#8A6100; --warn-bg:#FBF0D2;
  --cp:#2F67B1; --cars:#7A4FA8; --bb:#2A8358; --ps:#B0661C;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-ui:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141A; --surface:#151F28; --sunk:#1B2833; --fg:#E5ECF1; --muted:#93A5B4; --line:#283846;
  --ink:#5BC0D2; --ink-fg:#06171C; --hl:#E7C83A; --hl-fg:#1C1A0A;
  --ok:#5ACB8C; --ok-bg:#12301F; --bad:#F08A7F; --bad-bg:#3A1C19; --warn:#E9C266; --warn-bg:#352A0E;
  --cp:#7DAAF0; --cars:#BC97E6; --bb:#6CCB98; --ps:#E8A35E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141A; --surface:#151F28; --sunk:#1B2833; --fg:#E5ECF1; --muted:#93A5B4; --line:#283846;
  --ink:#5BC0D2; --ink-fg:#06171C; --hl:#E7C83A; --hl-fg:#1C1A0A;
  --ok:#5ACB8C; --ok-bg:#12301F; --bad:#F08A7F; --bad-bg:#3A1C19; --warn:#E9C266; --warn-bg:#352A0E;
  --cp:#7DAAF0; --cars:#BC97E6; --bb:#6CCB98; --ps:#E8A35E; color-scheme:dark}
html{font-size:calc(16px * var(--scale))}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.wrap.wide{max-width:1240px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;gap:6px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:40px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn small{font-size:.8rem;font-weight:700}
.icon-btn.say{padding:0 14px;border-width:2px;border-color:var(--ink)}
.icon-btn.say small{font-size:.86rem}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ctrl{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--surface);font-weight:700}
.ctrl[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}
.ctrl svg{width:18px;height:18px}
.modeseg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.modeseg button{border:0;background:var(--surface);min-height:40px;padding:6px 14px;font-weight:700}
.modeseg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}
.auto-note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.92rem;background:var(--sunk);border-radius:8px;padding:8px 12px}
.why{display:grid;gap:4px}
.stem p{margin:0 0 .5em}
.stem p:last-child{margin-bottom:0}
.fig{margin:.6em 0 1em;padding:10px;background:#fff;border:1px solid var(--line);border-radius:8px;text-align:center;overflow-x:auto}
.fig img{max-width:100%;height:auto;display:inline-block}
.fig-miss{font-size:.85rem;color:var(--muted);font-style:italic}
.ms p{margin:0 0 .4em}
.why h4{margin:0;font-family:var(--f-ui);font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:800;line-height:1.15}
h2{font-size:1.3rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
section.block{margin-top:28px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.hl{background:var(--hl);color:var(--hl-fg);border-color:var(--hl)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btn.listen{border:2px solid var(--ink);color:var(--ink);background:var(--surface)}
.btn.listen svg{color:var(--ink)}

/* hero */
.hero{padding-block:24px 4px;display:grid;gap:14px}
.hero p{margin:0;max-width:62ch;color:var(--muted)}

/* section tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}
@media (max-width:680px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc)}
.tile .code{font-family:var(--f-display);font-weight:800;font-size:1.35rem;color:var(--sc)}
.tile .nm{font-size:.82rem;color:var(--muted);line-height:1.3}
.tile .meter{height:6px;background:var(--sunk);border-radius:4px;margin-top:8px;overflow:hidden}
.tile .meter i{display:block;height:100%;background:var(--sc)}
.tile .stat{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.tile[aria-pressed="true"]{border-color:var(--sc);box-shadow:0 0 0 2px var(--sc) inset}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem;min-height:36px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media (max-width:520px){.actions{grid-template-columns:1fr}}
.action{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px}
.action svg{width:26px;height:26px;flex:none;color:var(--ink);margin-top:2px}
.action b{display:block;font-size:1rem}
.action span{font-size:.86rem;color:var(--muted)}

.resume{margin-top:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--hl);color:var(--hl-fg);border-radius:var(--r);padding:12px 16px}
.resume p{margin:0}

/* block list */
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--sc);padding-bottom:6px}
.sec-head .code{font-family:var(--f-display);font-weight:800;color:var(--sc);font-size:1.25rem}
.sec-head .facts{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.blist{list-style:none;margin:0;padding:0}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.brow .t{font-weight:700}
.brow .m{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.brow .confirm{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem;background:var(--bad-bg);padding:8px 10px;border-radius:8px}
.pill{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill.mastered{background:var(--ok-bg);color:var(--ok)}
.pill.progress{background:var(--warn-bg);color:var(--warn)}
.pill.new{background:var(--sunk);color:var(--fg)}
.pill.locked{background:transparent;color:var(--muted);border-color:var(--line)}
.bact{display:flex;gap:6px;align-items:center}
@media (max-width:520px){.brow{grid-template-columns:auto minmax(0,1fr)}.brow .bact{grid-column:1/-1;justify-content:flex-end;flex-wrap:wrap}}
.empty{padding:14px 2px;color:var(--muted);font-size:.92rem}
.src{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px}

.foot{margin-top:32px;font-size:.85rem;color:var(--muted);display:grid;gap:12px}
.settings{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:grid;gap:12px}
.settings label{display:grid;gap:4px;font-size:.9rem}
.settings .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.settings .two{grid-template-columns:1fr}}
input[type=range]{width:100%;accent-color:var(--ink)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.field{display:grid;gap:6px}
.field>span{font-weight:700;font-size:.92rem}
select,textarea,input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:140px;resize:vertical;font-family:var(--f-read);font-size:.95rem}
.drop{position:relative;border:2px dashed var(--ink);border-radius:var(--r);padding:24px 16px;text-align:center;display:grid;gap:8px;place-items:center;background:var(--bg);cursor:pointer}
.drop .file-hit{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2}
.reader{display:grid;gap:2px;padding-bottom:110px}
.reader p,.reader h3,.reader .r-label{margin:0;padding:6px 10px;border-radius:8px;cursor:pointer;scroll-margin:120px}
.reader p{font-family:var(--f-read);font-size:1.06rem;line-height:1.7;max-width:70ch}
.reader .r-head{font-family:var(--f-display);font-size:1.15rem;margin-top:14px}
.reader .r-label{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.reader .r-q{font-weight:600;margin-top:10px}
.reader .r-choice{padding-left:24px}
.reader .r-choice.r-ok{color:var(--ok);font-weight:600}
.reader .r-ans{color:var(--ok);font-family:var(--f-ui);font-weight:700}
.reader .r-exp{color:var(--muted);font-size:.98rem}
.reader .now,.reader .now.r-ok,.reader .now.r-ans,.reader .now.r-exp,.reader .now.r-label{background:var(--hl);color:var(--hl-fg)}
.reader .fig{cursor:default}
.rbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.rbar .btn{min-height:48px}
.btn.big{min-height:52px;font-size:1.05rem;padding-inline:22px}
.rnav{display:flex;align-items:center;gap:8px}
.rskip{width:48px;height:48px}
.rskip svg{width:30px;height:30px}
.rskip:disabled{opacity:.35}
.reader p.cur{background:var(--sunk)}
.reader .r-s{border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.reader .r-s.now{background:var(--hl);color:var(--hl-fg);padding:1px 0}
.rspeed{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.85rem}
.photo-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.photo-row{grid-template-columns:1fr}}
.photo-btn{position:relative;display:grid;gap:4px;justify-items:center;text-align:center;padding:16px 12px;border:2px solid var(--ink);border-radius:var(--r);background:var(--bg)}
.photo-btn svg{width:30px;height:30px;color:var(--ink)}
.photo-btn .muted{font-size:.84rem}
.photo-btn .file-hit{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2}
.photo-btn:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.drop:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.drop.over{border-color:var(--ink);background:var(--sunk)}
.drop svg{width:34px;height:34px;color:var(--ink)}
.filelist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.filelist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:.92rem;background:var(--bg);border-radius:8px;padding:10px 10px 10px 12px}
.filelist li .fn{grid-column:1 / -1;font-weight:700}
.filelist li .st{grid-column:1 / -1;text-align:left}
.filelist li .fa{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.filelist li .fa:empty{display:none}
.filelist li .confirm{grid-column:1 / -1;margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem;background:var(--bad-bg);padding:8px 10px;border-radius:8px}
.fgroups{display:grid;gap:8px}
.fg{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.fg-head{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 14px;border:0;background:transparent;text-align:left;border-left:4px solid var(--sc);min-height:56px}
.fg-code{font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:var(--sc);min-width:3.2em}
.fg-name{display:grid;font-weight:700;min-width:0}
.fg-name small{font-weight:400;color:var(--muted);font-size:.82rem}
.fg-count{min-width:30px;height:30px;padding:0 9px;border-radius:999px;display:grid;place-items:center;background:var(--sc);color:var(--surface);font-weight:700;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.fg-chev{color:var(--muted);font-size:.9rem}
.fg.open .filelist{padding:0 10px 10px}
.fg-body{padding:0 14px 6px}
.fg-body .blist .brow:last-child{border-bottom:0}
.filelist .fsz{color:var(--muted);font-size:.84rem}
.filelist .tag{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-right:6px}
.photo-row.off{opacity:.5}
.filelist .fn{overflow-wrap:anywhere}
.filelist .st{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);text-align:right}
.filelist .st.ok{color:var(--ok)} .filelist .st.bad{color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.log{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;max-height:220px;overflow:auto}
.note{font-size:.86rem;color:var(--muted);margin:0}
.banner{border-radius:8px;padding:10px 12px;font-size:.92rem}
.banner.ok{background:var(--ok-bg);color:var(--ok)} .banner.bad{background:var(--bad-bg);color:var(--bad)} .banner.warn{background:var(--warn-bg);color:var(--warn)}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px}
.qbar .where{margin-right:auto;min-width:0}
.qbar .where b{font-family:var(--f-display);font-size:1.1rem}
.qprog{height:6px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-bottom:16px}
.qprog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.score{font-family:var(--f-mono);font-size:.82rem;font-variant-numeric:tabular-nums}
.qgrid{display:grid;gap:18px}
.qgrid.split{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
@media (max-width:980px){.qgrid.split{grid-template-columns:minmax(0,1fr)}}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.qgrid.split .passage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:980px){.qgrid.split .passage{position:static;max-height:none}}
.passage .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.passage .ph h3{margin-right:auto}
.passage .ptext{font-family:var(--f-read);font-size:1.06rem;line-height:1.7;max-width:68ch}
.passage .ptext p{margin:0 0 .9em}
.passage.collapsed .ptext{max-height:7.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.qcard{min-width:0;display:grid;gap:14px}
.stem{font-family:var(--f-read);font-size:1.14rem;line-height:1.6;margin:0}
.qnum{display:flex;align-items:center;gap:8px}
.choices{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.choice{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);min-height:54px}
.choice .ltr{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sunk);font-family:var(--f-mono)}
.choice .ct{font-family:var(--f-read);font-size:1.02rem;overflow-wrap:anywhere}
.choice .mk{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.choice:not(:disabled):hover{border-color:var(--ink)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok);background:var(--ok-bg)} .choice.right .ltr{background:var(--ok);color:var(--surface)} .choice.right .mk{color:var(--ok)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)} .choice.wrong .ltr{background:var(--bad);color:var(--surface)} .choice.wrong .mk{color:var(--bad)}
.choice.dim{opacity:.6}
.fb{border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}
.fb .verdict{font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.fb.ok .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.fb p{margin:0}

function el(tag, props, ...kids){
  const n = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "on") for (const [e,f] of Object.entries(v)) n.addEventListener(e,f);
    else if (k === "style") n.style.cssText = v;
    else if (k === "html") n.innerHTML = v; // only used with static icon markup
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : String(k));
  return n;
}

function richNodes(text, tag){
  // text with [[FIG:id]] markers becomes paragraphs and pictures
  const out = [];
  for (const line of String(text||"").split(/\n\s*\n|\n/)){
    const parts = line.split(/(\[\[FIG:[^\]]+\]\])/);
    for (const part of parts){
      const m = part.match(/^\[\[FIG:([^\]]+)\]\]$/);

      else if (part.replace(/\[\[PIC:\d+\]\]/g,"").trim()) out.push(el(tag||"p",null,part.replace(/\[\[PIC:\d+\]\]/g,"").trim()));
    }
  }
  return out;
}

/* ---------- device storage (IndexedDB) for cached files and offline saving ---------- */
const IDB = {
  _p:null,
  open(){
    if (this._p) return this._p;
    this._p = new Promise(res=>{
      try {
        const r = indexedDB.open("mcat-block-trainer", 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("files")) d.createObjectStore("files"); if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv"); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
        r.onblocked = () => res(null);
      } catch(e){ res(null); }
    });
    return this._p;
  },
  async run(store, mode, fn){
    const d = await this.open(); if (!d) return null;
    return new Promise(res=>{
      try { const tx = d.transaction(store, mode); const req = fn(tx.objectStore(store)); tx.oncomplete = () => res(req ? req.result : true); tx.onerror = tx.onabort = () => res(null); }
      catch(e){ res(null); }
    });
  },
  get(store, k){ return this.run(store, "readonly", st=>st.get(k)); },
  put(store, k, v){ return this.run(store, "readwrite", st=>st.put(v, k)); },
  del(store, k){ return this.run(store, "readwrite", st=>st.delete(k)); },
  keys(store){ return this.run(store, "readonly", st=>st.getAllKeys()); }
};

  },
  async api(method, path, body){
    const r = await fetch(String(window.MBT_API || "api").replace(/\/+$/,"") + path, {method, headers: {"Content-Type":"application/json", ...(this.token ? {Authorization:"Bearer " + this.token} : {})}, body: body === undefined ? undefined : JSON.stringify(body)});
    if (r.status === 401 && this.token){ signOut(true); throw {code:"signed_out"}; }
    const j = await r.json().catch(()=>({}));
    if (!r.ok) throw {code: j.error || ("http_" + r.status), status: r.status, message: j.message || "The server didn't accept that."};
    return j;
  },
  // saves wait in a queue and retry, so a dropped connection doesn't lose work
  queue(key, fn){
    this.pending.set(key, fn); this.flush();
  },
  async flush(){
    if (this.busy) return; this.busy = true;
    let stuck = false;
    // keep sending until nothing is waiting (saves made while sending go out in the next round)
    while (this.pending.size && !stuck){
      for (const [key, fn] of [...this.pending]){
        try { await fn(); if (this.pending.get(key) === fn) this.pending.delete(key); }
        catch(e){
          if (e?.code === "signed_out") { this.pending.clear(); break; }
          if (e?.status >= 400 && e.status < 500 && e.status !== 429){ if (this.pending.get(key) === fn) this.pending.delete(key); toast(e.message || "The server didn't accept a change."); continue; }
          stuck = true; clearTimeout(this.timer); this.timer = setTimeout(()=>this.flush(), 15000);
          if (!this.warned){ this.warned = true; toast("Can't reach your server right now. Your changes will save when the connection is back."); }
          break;
        }
      }
    }
    if (!this.pending.size) this.warned = false;
    this.busy = false;
  }
};

/* Speech: the device's own voice when it works, otherwise a built-in voice that runs inside the page. */
const tts = {ok:true, native:"speechSynthesis" in window, nativeWorks:null, voice:null};
function pickVoice(){
  if (!tts.native) return;

  tts.voice = vs.find(v=>/en[-_]US/i.test(v.lang) && /natural|samantha|google|aria|jenny/i.test(v.name)) || vs.find(v=>/^en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if (tts.native){ try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch(e){ tts.native = false; } }

  const chunks = cleanSpeech(text).match(/[^.!?;]+[.!?;]*\s*/g) || [cleanSpeech(text)];
  let buf = ""; const parts = [];
  for (const c of chunks){ if ((buf + c).length > 200){ if (buf.trim()) parts.push(buf); buf = c; } else buf += c; }

let speechGen = 0, actx = null, curSrc = null, backupLoad = null;
function audioCtx(){

    if (actx && actx.state === "suspended") actx.resume();

/* Speaks text; resolves true when it finished, false if skipped or interrupted. */
function speak(text, force){
  return new Promise(res=>{
    if ((!S.settings.sound && !force) || !String(text||"").trim()) return res(false);
    const my = ++speechGen;
    let settled = false; const done = v => { if (!settled){ settled = true; res(!!v && my === speechGen); } };
    const parts = speechParts(text);
    try { if (tts.native) speechSynthesis.cancel(); } catch(e){}
    try { curSrc?.stop(); } catch(e){}
    if (usingBackup()) return speakBackup(parts, my, done);
    let started = false;
    try {
      parts.forEach((p,i)=>{
        const u = new SpeechSynthesisUtterance(p); u.rate = S.settings.rate; if (tts.voice) u.voice = tts.voice;
        u.onstart = () => { started = true; tts.nativeWorks = true; };
        if (i === parts.length-1){ u.onend = ()=>done(true); u.onerror = ()=>done(started); }
        speechSynthesis.speak(u);
      });
    } catch(e){ tts.nativeWorks = false; return speakBackup(parts, my, done); }
    // If the device voice stays silent, switch to the built-in voice and say it again.
    setTimeout(()=>{
      if (my !== speechGen || settled || started || tts.nativeWorks === true || document.hidden) return;
      let speaking = false; try { speaking = speechSynthesis.speaking && !speechSynthesis.paused; } catch(e){}
      if (speaking) return;
      tts.nativeWorks = false; try { speechSynthesis.cancel(); } catch(e){}
      speakBackup(parts, my, done);
    }, 1800);
    const wait = 4000 + cleanSpeech(text).length * 95 / S.settings.rate; let wasHidden = false;
    const fallback = ()=>{ if (settled || my !== speechGen) return; if (document.hidden){ wasHidden = true; return setTimeout(fallback, 2000); } if (wasHidden){ wasHidden = false; return setTimeout(fallback, wait); } if (tts.nativeWorks) done(true); };

}
async function speakBackup(parts, my, done){
  try {
    const ms = await loadBackupVoice();
    const ctx = audioCtx();
    if (!ctx){ toast("This screen can't play sound. Try opening the trainer in Chrome or Safari."); return done(false); }
    for (const p of parts){
      if (my !== speechGen) return done(false);
      const arr = ms.speak(p, bvOpts());
      if (!arr || !arr.length) continue;
      const ab = new Uint8Array(arr).buffer;
      const buf = await new Promise((ok,bad)=>{ const r = ctx.decodeAudioData(ab, ok, bad); if (r && r.catch) r.catch(bad); });
      if (my !== speechGen) return done(false);
      await new Promise(r=>{ const s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination); s.onended = r; curSrc = s; s.start(0); });
    }
    curSrc = null;
    done(true);
  } catch(e){
    toast(OFFLINE && !window.meSpeak ? "This browser has no reading voice. Open this file in Chrome or Safari." : "Couldn't play the reading voice. Check that your phone isn't on silent.");
    done(false);
  }
}

/* ---------- bank helpers ---------- */
function allBlocks(){ const list = Object.values(blocks); return list; }
function track(section, source){ return allBlocks().filter(b=>b.section===section && b.source===source).sort((a,b)=>a.n-b.n); }
function sampleFor(section){ return S.settings.hideSamples ? null : SAMPLES.find(b=>b.section===section); }
function getBlock(id){ return blocks[id] || SAMPLES.find(b=>b.id===id); }
function prog(id){ return S.progress[id] || (S.progress[id] = {passes:0,best:null,last:null,mastered:false,history:[],lastMissed:[]}); }
function peekProg(id){ return S.progress[id] || {passes:0,best:null,last:null,mastered:false,history:[],lastMissed:[]}; }
function isUnlocked(b){
  if (b.source === "sample" || b.pack) return true;   // each generated pack is its own set, open any time
  if (peekProg(b.id).forced) return true;
  const t = track(b.section, b.source); const i = t.findIndex(x=>x.id===b.id);
  return i <= 0 || peekProg(t[i-1].id).mastered;
}
function blockStatus(b){
  const p = peekProg(b.id);
  if (p.mastered) return "mastered";
  if (!isUnlocked(b)) return "locked";

}

function addToBank({section, source, passages, questions, file, pack}){
  // keep questions that share a passage together
  const groups = []; const byKey = {};
  for (const q of questions){
    if (q.p){ if (!byKey[q.p]){ byKey[q.p] = {p:q.p, qs:[]}; groups.push(byKey[q.p]); } byKey[q.p].qs.push(q); }
    else groups.push({p:null, qs:[q]});
  }
  const touched = new Set();
  for (const g of groups){
    const t = track(section, source);
    if (pack){
      // a generated pack is its own block, never mixed with earlier packs
      let b = pack.bid && blocks[pack.bid];
      if (!b || b.questions.length + g.qs.length > BLOCK_SIZE || blockBytes(b) > 190000){
        pack.part = (pack.part || 0) + 1;
        b = {id:uid("b"), section, source, n: pack.part === 1 && pack.slot != null ? pack.slot : (t.length ? t[t.length-1].n + 1 : 1), title:"", createdAt:Date.now(), passages:{}, questions:[], files:[],
             pack:{n:pack.n, topic:pack.topic, level:pack.level, count:pack.count, at:pack.at}};
        b.title = `Pack ${pack.n}` + (pack.part > 1 ? ` (part ${pack.part})` : "") + ` · ${pack.topic}`;
        blocks[b.id] = b; pack.bid = b.id; (pack.ids = pack.ids || []).push(b.id);
      }
      if (g.p && passages[g.p]) b.passages[g.p] = passages[g.p];
      for (const q of g.qs) b.questions.push(q);
      touched.add(b.id);
      continue;
    }
    let b = t[t.length-1];
    const started = b && (peekProg(b.id).passes > 0 || S.session?.blockId === b.id);
    const full = b && (b.questions.length + g.qs.length > BLOCK_SIZE || blockBytes(b) > 190000);
    if (!b || started || (full && b.questions.length > 0)){
      b = {id:uid("b"), section, source, n:(t.length ? t[t.length-1].n + 1 : 1), title:"", createdAt:Date.now(), passages:{}, questions:[], files:[]};
      b.title = "Block " + b.n;
      blocks[b.id] = b;
    }
    if (g.p && passages[g.p]) b.passages[g.p] = passages[g.p];
    for (const q of g.qs) b.questions.push(q);
    if (file && !b.files.includes(file)) b.files.push(file);
    touched.add(b.id);
  }
  for (const id of touched) saveBlock(blocks[id]);
  return [...touched].map(id=>blocks[id]);
}

function mergeBank(bank, quiet){
  if (!bank || typeof bank.blocks !== "object") return 0;
  if (quiet && (S.bankAt||0) >= (bank.exportedAt||0)) return 0;
  let n = 0;
  for (const [id,b] of Object.entries(bank.blocks)){ if (b && Array.isArray(b.questions)){ blocks[id] = b; n += b.questions.length; } }
  if (bank.figs && typeof bank.figs === "object"){ Object.assign(figs, bank.figs); if (Store.mode === "server") for (const [id,f] of Object.entries(bank.figs)) Store.putFig(id, f); else IDB.put("kv", "figs", figs); }

  return n;
}

async function restoreBackup(data, mode){
  if (!data || data.kind !== "backup" || !data.blocks || !data.state) throw new Error("not a backup");
  if (mode === "replace"){
    for (const id of Object.keys(blocks)) if (!data.blocks[id]) Store.delBlock(id);
    for (const id of Object.keys(figs)) if (!(data.figs||{})[id]) Store.delFig(id);
    blocks = data.blocks; figs = data.figs || {};
    const keepLook = {theme: S.settings.theme, scale: S.settings.scale};
    S = {...S, ...data.state, settings: {...S.settings, ...(data.state.settings||{}), ...keepLook}};
    for (const r of fileRecs()) if (r.status === "reading") r.status = "new";
  } else {
    for (const [id, b] of Object.entries(data.blocks)) if (!blocks[id]) blocks[id] = b;
    for (const [id, f] of Object.entries(data.figs||{})) if (!figs[id]) figs[id] = f;
    const st = data.state;
    for (const [id, p] of Object.entries(st.progress||{})) if (!S.progress[id]) S.progress[id] = p;
    const have = new Set(fileRecs().map(r=>r.id)); for (const r of st.files||[]) if (!have.has(r.id)) fileRecs().push(r);
    S.readPos = {...(st.readPos||{}), ...(S.readPos||{})};
  }
  const haveL = new Set(links().map(l=>l.url)); for (const l of data.links||data.state.links||[]) if (l?.url && !haveL.has(l.url)){ links().push(l); haveL.add(l.url); }

  for (const [id, t] of Object.entries(data.texts||{})) Store.putText(id, t);

}
// turn a share link into a direct download where the service allows it
function directLink(u){
  try {
    const url = new URL(u.trim()); const h = url.hostname;
    let m;
    if (/drive\.google\.com$/.test(h)){ const id = (url.pathname.match(/\/d\/([\w-]+)/)||[])[1] || url.searchParams.get("id"); if (id) return `https://drive.google.com/uc?export=download&id=${id}`; }
    if (/docs\.google\.com$/.test(h) && (m = url.pathname.match(/\/document\/d\/([\w-]+)/))) return `https://docs.google.com/document/d/${m[1]}/export?format=docx`;
    if (/dropbox\.com$/.test(h)){ url.hostname = "dl.dropboxusercontent.com"; url.searchParams.delete("dl"); return url.href; }
    if (/onedrive\.live\.com$|1drv\.ms$|sharepoint\.com$/.test(h)){ url.searchParams.set("download", "1"); return url.href; }
    return url.href;
  } catch(e){ return null; }
}

    let name = l.title || decodeURIComponent((new URL(l.url).pathname.split("/").pop()||"Linked file"));
    if (ext && !name.toLowerCase().endsWith(ext)) name += ext;
    resetImport(); await addFiles([new File([blob], name, {type})]); setView("import");

/* ---------- quiz ---------- */
function startBlock(id, mode){

  let qs = b.questions;
  if (mode === "missed"){ const miss = new Set(peekProg(id).lastMissed||[]); qs = qs.filter(q=>miss.has(q.id)); if (!qs.length){ toast("Nothing missed last time."); return; } }

  const groups = []; const byP = {};
  for (const q of qs){ if (q.p){ if (!byP[q.p]){ byP[q.p]=[]; groups.push(byP[q.p]); } byP[q.p].push(q.id); } else groups.push([q.id]); }

}
function currentQ(){
  const s = S.session; if (!s) return null;
  const b = getBlock(s.blockId); if (!b) return null;

}
function readCurrent(){
  const c = currentQ(); if (!c || !S.settings.sound) return;
  if (S.session.picks[c.q.id] != null) return;
  const s = S.session;
  const prev = s.pos > 0 ? c.b.questions.find(x=>x.id===s.order[s.pos-1]) : null;
  const newPassage = c.passage && (!prev || prev.p !== c.q.p);
  let t = `Question ${s.pos+1}. ` + questionSpeech(c.q);
  if (newPassage && S.settings.readPassages) t = `Passage. ${c.passage.title || ""}. ${c.passage.text} ... Now, question ${s.pos+1}. ` + questionSpeech(c.q);

function questionSpeech(q){ return q.stem + " " + q.choices.map((ch,i)=>`${LETTERS[i]}. ${ch}.`).join(" "); }
function feedbackSpeech(q, i){
  if (i === q.answer) return "Correct! " + (q.exp ? "Here's why. " + q.exp : "");
  let t = `Not correct. The correct answer is ${LETTERS[q.answer]}: ${q.choices[q.answer]}. ` + (q.exp ? "Here's why. " + q.exp : "");
  if (q.notes?.[i]) t += ` About your answer, ${LETTERS[i]}: ${q.notes[i]}`;

}

async function autoAdvance(qid, speechDone){

  const still = () => my === autoToken && ui.view === "quiz" && S.session && S.session.order[S.session.pos] === qid && S.settings.flow === "auto";
  if (!still()) return;
  const q = currentQ()?.q;
  let n = spoke ? 2 : Math.min(14, 5 + Math.round(((q?.exp||"").length + (q?.notes?.[S.session.picks[qid]]||"").length) / 70));
  const note = $("#autoNote");
  const draw = () => { if (!note) return; note.hidden = false; note.replaceChildren(
    el("span",null,`Next question in ${n}s`),
    el("button",{class:"btn small",type:"button",on:{click:()=>cancelAuto("Paused. Press Next question when you're ready.")}},"Pause")); };
  draw();
  autoTick = setInterval(async ()=>{
    if (!still()){ clearInterval(autoTick); return; }
    n--; if (n > 0) return draw();
    clearInterval(autoTick); autoTick = null;
    if (S.settings.sound) await speak("Next question.");
    if (still()) next();

}

function choose(i){

function finish(){
  const s = S.session; const b = getBlock(s.blockId);
  const ids = s.order;
  const missed = ids.filter(id=>{ const q=b.questions.find(x=>x.id===id); return q && s.picks[id] !== q.answer; });
  const correct = ids.length - missed.length;
  const score = pct(correct, ids.length);
  const p = prog(b.id);
  let newlyMastered = false;
  if (s.mode === "full"){
    p.passes++; p.last = score; p.best = Math.max(p.best ?? 0, score);
    p.history = [...(p.history||[]), score].slice(-24);
    p.lastMissed = missed;
    if (!p.mastered && score >= S.settings.mastery){ p.mastered = true; newlyMastered = true; }
  } else {
    p.lastMissed = missed;
  }
  ui.result = {blockId:b.id, mode:s.mode, correct, total:ids.length, score, missed:missed.map(id=>({id, pick:s.picks[id]})), newlyMastered};
  S.session = null; saveState(); setView("result");

}

  if (!text && r && recHere(r) && r.kind !== "photo" && r.kind !== "photos"){
    try { const blob = await getBlob(r.blobIds[0]); const d = await extractDoc(blob, r.name); text = readerTextOf(d); if (text) Store.putText(id, text); } catch(e){}
  }

function readerQuestions(id){
  const out = [];
  for (const b of Object.values(blocks).sort((a,b)=>(a.section+a.n).localeCompare(b.section+b.n)))
    for (const q of b.questions) if (q.fileId === id) out.push({b, q});

      if (/^(?:question|answer|ans)\s*\d{0,3}\s*[:.]?\s*$/i.test(t) || /^question\s+\d+\s+of\s+\d+$/i.test(t)){ P.push({kind:"label", t, say:t.replace(/[:.]\s*$/,"") + "."}); continue; }
      if (/^passage\b/i.test(t) && t.length < 90){ P.push({kind:"head", t, say:t + "."}); continue; }
      const lab = t.match(/^(question|answer|ans)\s*[:.]\s*(.+)$/i);

const PART_TEXT = 5000;

  const pageCap = Math.max(1, Math.min(3, maxImg || 3));

    const size = it.s ? it.s.length : 0;
    const isImg = it.t === "pic" || it.t === "photo";
    if (cur.length){
      if (it.t === "text" && len > PART_TEXT*0.6 && BOUNDARY.test(it.s)) flush();
      else if (len + size > PART_TEXT*1.3) flush();
      else if (isImg && imgs >= Math.max(1, maxImg)) flush();
      else if (it.t === "page" && pages >= pageCap) flush();

    if (it.t === "text" && size > PART_TEXT*1.3){ for (const c of chunkText(it.s, PART_TEXT)){ flush(); cur.push({t:"text", s:c}); len = c.length; } continue; }

      if (ans && stem) out.push({sec, pkey: cur.p, q:{id:uid("q"), fileId, stem, choices:[ans], answer:0, exp:"", topic:"", from:"doc", needsChoices:true}});

    if (QA.noPassage.test(t) && t.length < 80){ closeQ(); closePassage(); pkey = null; mode = "free"; continue; }
    if (QA.head.test(t) && t.length < 90 && /passage/i.test(t)){ closeQ(); closePassage(); pkey = null; const rg = t.match(/questions?\s*(\d+)\s*(?:-|–|—|to)\s*(\d+)/i); pbuf = {title: t.replace(/[*()]+$/,"").replace(/\s*\(questions?[^)]*\)?/i,"").trim() || null, lines:[], left: rg ? (+rg[2] - +rg[1] + 1) : null}; mode = "passage"; continue; }
    if ((m = t.match(QA.a)) && cur && (mode === "stem" || mode === "q")){ cur.ans = m[1] ? [m[1]] : []; mode = "ans"; ansLines = 0; continue; }

    if ((m = t.match(QA.a)) && mode === "passage" && pbuf && pbuf.lines.length >= 2){
      const stem = pbuf.lines.pop(); closePassage(); cur = newQ([stem]); cur.ans = m[1] ? [m[1]] : []; mode = "ans"; ansLines = 0; continue;
    }
    if ((m = t.match(QA.q)) && (/^(?:question|q)\s*\d{0,3}\s*[:.]?\s*$/i.test(t) || /^question\s*[:.)\-–]\s*\S/i.test(t) || /^question\s+\S/i.test(t) && !/^question(?:s)?\s+(?:\d|of)/i.test(t))){

      closeQ(); if (pbuf) closePassage();

      cur = newQ(m[1] && !/^\d{1,3}$/.test(m[1]) ? [m[1]] : []); mode = "stem"; continue;
    }
    if (mode === "passage"){ pbuf.lines.push(t); continue; }
    if (mode === "stem" && cur){ cur.stem.push(t); continue; }
    if (mode === "ans" && cur){

      if (bold || ansLines >= 3 || (cur.ans.join(" ").length > 30 && t.length > 160)){ closeQ(); mode = "free"; if (!bold) { pbuf = pbuf || {title:null, lines:[]}; pbuf.lines.push(t); mode = "passage"; } continue; }

    }

}
/* Turn answer-only questions into multiple choice: Claude writes three believable wrong choices.
   Without Claude, wrong choices are borrowed from other answers in the same file. */
async function makeChoices(found, passages, signal, log, canAsk){
  const need = found.filter(f=>f.q.needsChoices);
  if (!need.length) return;
  // 1) prepared choices for known tests (no Claude needed)
  const lib = await loadChoiceLib();
  let fromLib = 0;
  for (const f of need){
    const hit = lib[stemKey(f.q.stem)];
    if (!hit) continue;
    if (hit.skip){ f.drop = true; delete f.q.needsChoices; continue; }
    if (Array.isArray(hit.w) && hit.w.length >= 3){ setChoices(f, hit.w, hit.e || "", []); f.q.prepared = true; fromLib++; }
  }
  if (fromLib) log(`  used prepared answer choices for ${fromLib} of ${need.length} questions`);
  const still = need.filter(f=>f.q.needsChoices);
  if (!still.length) return;
  need.length = 0; need.push(...still);
  // group by passage so Claude sees the passage once
  const groups = [];
  for (const f of need){ const g = groups[groups.length-1]; if (g && g.pkey === f.pkey && g.items.length < 8) g.items.push(f); else groups.push({pkey:f.pkey, items:[f]}); }
  let done = 0, viaClaude = 0;
  const work = groups.slice();
  const worker = async () => {
    while (work.length && canAsk && !signal.aborted){
      const g = work.shift();
      const ptext = g.pkey && passages[g.pkey] ? passages[g.pkey].text.replace(/\[\[PIC:\d+\]\]/g,"[figure]").slice(0,4500) : "";
      const list = g.items.map((f,n)=>`${n+1}. Question: ${f.q.stem}\n   Correct answer: ${f.q.choices[0]}`).join("\n\n");
      try {
        const r = await sample.json(`These are MCAT practice questions from a student's study file. Each has its correct answer, but no other answer choices. Turn each into a 4-choice multiple-choice question in the style of the real AAMC MCAT.
${ptext ? "\nPassage they belong to:\n" + ptext + "\n" : ""}
${list}

For each question write exactly 3 wrong choices that are believable to a student who half-knows the material (common misconceptions, near-miss terms, reversed relationships, statements true in general but not answering this question). Match the correct answer's length, grammar and style so the right one doesn't stand out. Never write a second correct answer. Keep the correct answer text exactly as given.
Also write "explanation": 2-3 sentences on why the correct answer is right, and "notes": one short phrase for each of the 3 wrong choices saying why it is wrong.
Reply with only JSON: [{"n":1,"wrong":["...","...","..."],"explanation":"...","notes":["...","...","..."]}]`, {signal, modelTier:"default"});
        for (const a of (Array.isArray(r) ? r : [])){
          const f = g.items[(+a.n||0)-1];
          if (!f || !Array.isArray(a.wrong) || a.wrong.length < 3) continue;
          const wrong = a.wrong.slice(0,3).map(w=>String(w).trim()).filter(Boolean);
          if (wrong.length < 3) continue;
          setChoices(f, wrong, String(a.explanation||""), Array.isArray(a.notes) ? a.notes.map(x=>String(x||"")) : []);
          f.q.from = "doc"; viaClaude++;
        }
      } catch(e){ if (e?.code === "cancelled" || FATAL_SAMPLE.includes(e?.code) || e?.code === "rate_limited"){ work.length = 0; break; } }
      done += g.items.length;
      log(`  writing answer choices: ${Math.min(done, need.length)} of ${need.length}`, true);
    }
  };
  if (canAsk) await Promise.all([worker(), worker()]);
  // anything still without choices: borrow other answers from the same passage, then the same file
  const pool = need.map(f=>f.q.choices[0]);
  for (const f of need){
    if (!f.q.needsChoices) continue;
    const right = f.q.choices[0];
    const bad = x => !x || x.toLowerCase() === right.toLowerCase();
    const byLen = arr => arr.sort((a,b)=>Math.abs(a.length-right.length)-Math.abs(b.length-right.length));
    const near = byLen([...new Set(need.filter(o=>o!==f && o.pkey && o.pkey===f.pkey).map(o=>o.q.choices[0]))].filter(x=>!bad(x)));
    const rest = byLen([...new Set(pool)].filter(x=>!bad(x) && !near.includes(x)));
    const wrong = near.slice(0,3).concat(rest).slice(0,3);
    if (wrong.length < 2){ f.drop = true; continue; }
    setChoices(f, wrong, "", []);
    f.q.borrowed = true;
  }
  if (canAsk) log(`  Claude wrote answer choices for ${viaClaude} of ${need.length} questions` + (viaClaude < need.length ? "; the rest borrow wrong choices from other answers in the file" : ""));
  else log(`  ${need.length} questions had only an answer, so their wrong choices were borrowed from other answers in the file (connect Claude and tap Read again for better ones)`);
}
function setChoices(f, wrong, exp, notes){
  const right = f.q.choices[0];
  const all = [{t:right, ok:true, n:"Correct."}].concat(wrong.map((w,i)=>({t:w, ok:false, n:notes[i]||""})));
  shuffle(all);
  f.q.choices = all.map(x=>x.t);
  f.q.answer = all.findIndex(x=>x.ok);
  f.q.notes = all.some(x=>x.n && !x.ok) ? all.map(x=>x.ok ? "This is the correct answer." : x.n) : [];
  if (exp) f.q.exp = exp;
  delete f.q.needsChoices;
}
function sectionFromName(name){
  const n = name.toLowerCase().replace(/[_\-.]+/g," ");
  if (/critical analysis|\bcars\b|reasoning skills/.test(n)) return "CARS";
  if (/chemical and physical|chem ?\/? ?phys|\bc ?\/ ?p\b|chem phys/.test(n)) return "CP";
  if (/biological and biochemical|bio ?\/? ?biochem|\bb ?\/ ?b\b|living systems/.test(n)) return "BB";
  if (/psychological|social|behavior|psych ?\/? ?soc|\bp ?\/ ?s\b/.test(n)) return "PS";
  return null;
}

/* pictures from a Word file go into figure storage; passages and questions point to them */
async function figData(p){
  const okType = /^image\/(png|jpe?g|gif|webp)$/i.test(p.type);
  if (okType && p.b64.length < 260000) return `data:${p.type};base64,${p.b64}`;
  try {
    const bmp = await createImageBitmap(b64Blob(p.b64, p.type));
    const sc = Math.min(1, 1000 / bmp.width);
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(bmp,0,0,c.width,c.height);
    for (const q of [0.8, 0.6, 0.45]){ const d = c.toDataURL("image/jpeg", q); if (d.length < 240000) return d; }
  } catch(e){}
  return null;
}
function readerTextOf(doc){
  const m = doc.figMap || {};
  return String(doc.raw || doc.text || "").replace(/\[\[PIC:(\d+)\]\]/g, (_,i)=> m[i] ? `\n[[FIG:${m[i]}]]\n` : "").replace(/\*\*/g,"").replace(/\n{3,}/g,"\n\n").trim();
}
async function attachFigures(found, passages, doc, fileId){
  if (!doc.pics?.length) return 0;
  const used = new Set(); const map = {};
  const scan = t => { for (const m of String(t).matchAll(/\[\[PIC:(\d+)\]\]/g)) used.add(+m[1]); };
  for (const p of Object.values(passages)) scan(p.text);
  for (const f of found) scan(f.q.stem);
  let n = 0;
  for (const i of used){
    const p = doc.pics[i]; if (!p) continue;
    const data = await figData(p); if (!data) continue;
    const id = uid("g"); figs[id] = {data, fileId}; map[i] = id; n++;
    await Store.putFig(id, figs[id]);
  }
  doc.figMap = map;
  const swap = t => String(t).replace(/\[\[PIC:(\d+)\]\]/g, (_,i)=> map[i] ? `[[FIG:${map[i]}]]` : "");
  for (const p of Object.values(passages)) p.text = swap(p.text);
  for (const f of found) f.q.stem = swap(f.q.stem);
  return n;
}

/* ----- text recognition (OCR): reads words in screenshots, scanned PDFs and photos, right on this device ----- */
let ocrP = null;
function getOCR(){
  if (ocrP) return ocrP;
  ocrP = (async () => {
    if (OFFLINE) throw new Error("Text recognition isn't available in the offline copy. Add this file in the Claude version.");
    await scriptOnce("tess/tesseract.min.js");
    const base = new URL("tess/", location.href).href;
    // the language data is served as "eng-traineddata.wasm"; the "#" makes the browser drop the ".traineddata.gz" ending the engine adds
    // start the reader, but never wait forever: a stuck start ends with a clear message
    let failed = null;
    const start = window.Tesseract.createWorker("eng", 1, {workerPath: base + "worker.min.js", corePath: base, langPath: base + "eng-traineddata.wasm#", gzip: true, errorHandler: e => { failed = e; }});
    const limit = new Promise((_,rej)=>{ const t0 = Date.now(); const iv = setInterval(()=>{ if (failed || Date.now() - t0 > 120000){ clearInterval(iv); rej(new Error("The text reader couldn't start on this device. Check your connection and try again.")); } }, 500); start.then(()=>clearInterval(iv), ()=>clearInterval(iv)); });
    return await Promise.race([start, limit]);
  })().catch(e => { ocrP = null; throw (e && e.message) ? e : new Error("Text recognition couldn't start on this device."); });
  return ocrP;
}
async function prepForOCR(blob){
  // enlarge small screenshots and put them on white: the reader is most accurate at about 1600–2400 px wide
  const bmp = await createImageBitmap(blob);
  const sc = bmp.width < 1400 ? Math.min(2.5, 1600 / bmp.width) : Math.min(1, 2400 / bmp.width);
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.imageSmoothingQuality = "high"; x.drawImage(bmp,0,0,c.width,c.height);
  return c;
}
function cleanOCR(t){
  const txt = String(t).replace(/\r/g,"").replace(/[ \t]+\n/g,"\n")
    .replace(/^[O0o©®○●◯•◉⊙@]\s+(?=\(?[A-Ha-h][.)]\s)/gm,"")      // radio buttons read as "O" before a choice
    .replace(/(\s)\|(\s)/g,"$1I$2")                                  // a lone "|" is almost always the letter I
    .replace(/\n{3,}/g,"\n\n").trim();
  // rejoin lines the screenshot wrapped, but keep choices, labels and headings on their own lines
  const START = /^(?:\(?[A-Ha-h][.):]\s|question\b|q\s*\d|answer\b|ans\b|correct\b|explanation\b|passage\b|educational\s+objective|\d{1,3}[.)]\s|[✓✔✗✘])/i;
  return txt.split(/\n\s*\n/).map(block => {
    const out = [];
    for (const line of block.split("\n").map(x=>x.trim()).filter(Boolean)){
      const prev = out[out.length-1];
      if (prev != null && !START.test(line) && !START.test(prev) && !/[.?!:]$/.test(prev)) out[out.length-1] = prev + " " + line;
      else if (prev != null && !START.test(line) && START.test(prev) && /^\(?[A-Ha-h][.):]\s/.test(prev) && !/[.?!]$/.test(prev) && line.length < 80 && /^[a-z(]/.test(line)) out[out.length-1] = prev + " " + line;

    }

  }).join("\n\n");
}
async function ocrBlob(blob){
  const w = await getOCR(); const c = await prepForOCR(blob);
  const res = await Promise.race([w.recognize(c), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")), 90000))]);

function imageHeavy(doc){ const chars = (doc.text||"").replace(/\s/g,"").length; return chars < 400 || chars < 250 * (doc.pics?.length || 0); }
async function ocrDoc(doc, say){

  const needs = doc.kind === "photos" || (doc.kind === "pdf" && doc.scanned) || (doc.kind === "docx" && doc.pics?.length && imageHeavy(doc));
  if (!needs) return false;
  say("Loading the text reader…");
  await getOCR();
  if (doc.kind === "photos"){
    const out = [];
    for (let i=0;i<doc.photos.length;i++){ say(`Recognizing text: photo ${i+1} of ${doc.photos.length}…`); try { out.push(await ocrBlob(doc.photos[i])); } catch(e){} }

  if (doc.kind === "pdf"){

    el("div",{class:"seg"}, ...[["standard","Exam level"],["hard","Harder than exam"]].map(([v,l])=>el("button",{class:"chip",type:"button","aria-pressed":String(gen.level===v),disabled:gen.running,on:{click:()=>{gen.level=v; render();}}}, l)))));

    el("button",{class:"btn primary big",type:"button",id:"genGo",disabled:gen.running || SERVER || OFFLINE,on:{click:runGenerate}}, gen.running ? "Writing questions…" : `${rb ? "Replace with" : "Generate"} ${gen.count} ${sec.code} questions${gen.topic.trim()?" on "+gen.topic.trim():""}`));
  if (gen.running) row.append(el("button",{class:"btn",type:"button",on:{click:()=>gen.ctl?.abort()}},"Stop"));
  panel.append(row);
  if (gen.status) panel.append(el("div",{class:"banner "+(gen.error?"bad":gen.running?"warn":"ok"),"aria-live":"polite",id:"genStatus"}, gen.status,
    !gen.running && gen.made ? el("div",{style:"margin-top:8px"}, el("button",{class:"btn small primary",type:"button",on:{click:()=>{ ui.section=gen.section; ui.source="online"; setView("home"); }}},"See my packs")) : null));
  m.append(panel);
}
function genPrompt(k){
  const sec = SECTIONS[k];
  const avoid = (S.recentTopics[k]||[]).slice(-25);
  const shape = k === "CARS"
    ? `One original passage of 500-600 words in the humanities or social sciences (for example ${sec.topics.join(", ")}), written as an argument with a clear authorial voice, nuance and at least one opposing view, like real CARS passages. Then 6 questions that need only the passage (no outside knowledge), spread across Foundations of Comprehension, Reasoning Within the Text, and Reasoning Beyond the Text. Every question uses the passage.`
    : `One original passage of 250-400 words, like a real MCAT science passage: a research study, experiment, or clinical scenario, with any data table described in plain text. Then 4 questions that require the passage, plus 2 discrete (stand-alone) questions on related content. Mix content recall with data interpretation and scientific reasoning.`;
  return `Write one original MCAT practice set for the "${sec.name}" section, for a student taking the MCAT in 2027. Match the style, difficulty and content of the current AAMC MCAT exam and its official content outline (foundational concepts, content categories and the four scientific inquiry and reasoning skills), as tested on current exams and AAMC practice materials. Do not copy or paraphrase questions from any published exam, QBank or book; write new ones.
${gen.topic.trim() ? `Focus area: ${gen.topic.trim()}.` : "Pick a high-yield topic from the AAMC content outline for this section."}
Difficulty: ${gen.level==="hard" ? "harder than an average exam question; aim at the top-scoring range" : "typical exam difficulty, with one or two harder questions"}.
${avoid.length ? `Choose a different topic from these recently used ones: ${avoid.join("; ")}.` : ""}

${shape}

Rules for every question: exactly 4 answer choices; exactly one is clearly correct; wrong choices are plausible, the kind of traps the real exam uses. Write choices so they can be shown in any order (no "all of the above", no references to letters). Explanation: 2-3 sentences on why the correct answer is right. Notes: one short sentence per choice, in the same order as the choices, saying why that choice is right or exactly why it is wrong (the trap it sets). Plain text only: write formulas and units like H2O, Na+, m/s^2, 10^-3 M. Facts must be accurate.

Reply with only JSON in exactly this shape:
{"topic":"short topic label","passageTitle":"short title","passage":"full passage text, paragraphs separated by \\n\\n","questions":[{"usesPassage":true,"stem":"...","choices":["...","...","...","..."],"answer":0,"explanation":"...","notes":["...","...","...","..."],"skill":"short skill label"}]}`;
}
async function runGenerate(){
  if (gen.running) return;
  if (!sample){
    gen.status = "Connecting to Claude…"; gen.error = ""; render();
    await ensureSample();
    if (!sample){ gen.error = gen.status = "Claude didn't connect on this screen, so nothing was generated. Open this trainer at claude.ai in Chrome or Safari, or in the Claude desktop app, and try again."; render(); return; }
  }
  gen.running = true; gen.ctl = new AbortController(); gen.made = 0; gen.error = "";
  const k = gen.section; const sets = Math.ceil(gen.count/6);
  const old = gen.replace && blocks[gen.replace]?.section === k ? blocks[gen.replace] : null;
  const nums = track(k, "online").map(b => b.pack?.n || 0);
  const pack = {n: old?.pack?.n || (Math.max(0, ...nums, track(k,"online").length) + 1), slot: old ? old.n : null, topic: gen.topic.trim() || "Mixed topics", level: gen.level, count: gen.count, at: Date.now(), bid: null};
  gen.status = `Writing set 1 of ${sets}…`; render();
  for (let i=0;i<sets;i++){
    if (gen.ctl.signal.aborted) break;
    gen.status = `Writing set ${i+1} of ${sets}… ${gen.made} questions saved so far.`; const st=$("#genStatus"); if (st) st.firstChild.textContent = gen.status;
    try {
      const d = await sample.json(genPrompt(k), {signal:gen.ctl.signal, modelTier:"default", cache:false});
      const qs = (d?.questions||[]).filter(validQ);
      if (!qs.length) continue;
      const pk = uid("p");
      const passages = d.passage ? {[pk]:{title:String(d.passageTitle||"Passage"), text:String(d.passage)}} : {};
      const questions = qs.map(q=>{
        const order = shuffle(q.choices.map((c,idx)=>idx));
        return {id:uid("q"), p:(q.usesPassage!==false && d.passage) ? pk : null, stem:q.stem.trim(), choices:order.map(o=>q.choices[o].trim()), answer:order.indexOf(+q.answer), exp:String(q.explanation||""), notes:(Array.isArray(q.notes) && q.notes.length===q.choices.length) ? order.map(o=>String(q.notes[o]||"")) : [], topic:String(d.topic||q.skill||""), from:"gen"};
      });
      // passage questions first, then discrete
      questions.sort((a,b)=>(a.p?0:1)-(b.p?0:1));
      addToBank({section:k, source:"online", passages, questions, file:null, pack});
      gen.made += questions.length;
      if (d.topic){ (S.recentTopics[k] = S.recentTopics[k]||[]).push(String(d.topic).slice(0,60)); S.recentTopics[k] = S.recentTopics[k].slice(-40); }
      saveState();
    } catch(e){
      if (e?.code === "cancelled") break;
      const fatal = {not_granted:"Claude wasn't allowed on this page, so nothing was generated.", sampling_disabled:"Claude isn't available for this account.", rate_limited:"You've reached your Claude usage limit for now. Try again later.", session_expired:"Please sign in to Claude again."}[e?.code];
      if (fatal){ gen.error = fatal; break; }
      if (e?.code === "refused") continue;
      if (i === sets-1 && !gen.made) gen.error = "Couldn't write questions this time. Try again.";
    }
  }
  gen.running = false;
  if (old && gen.made && blocks[old.id]){
    // the new pack is saved, so the one it replaces goes now
    delete blocks[old.id]; delete S.progress[old.id];
    if (S.session?.blockId === old.id) S.session = null;
    Store.delBlock(old.id); saveState();
  }
  if (gen.made) gen.replace = null;
  gen.status = gen.error || (gen.made ? `Done. ${gen.made} new questions saved as ${SECTIONS[k].code} Pack ${pack.n}${old ? ", replacing the old one" : ""}. Find it under Generated online.` : "Stopped before any questions were saved.");
  render();
}

/* ---------- global controls ---------- */
$("#homeBtn").addEventListener("click",()=>{ if (ui.view === "login") return; if (ui.view==="quiz") saveState(); setView("home"); });
$("#themeBtn").addEventListener("click",()=>{ S.settings.theme = isDark() ? "light" : "dark"; applyLook(); saveState(); });
$("#soundBtn").addEventListener("click",()=>{ S.settings.sound = !S.settings.sound; applyLook(); saveState(); if (S.settings.sound){ speak("Read aloud is on.", true); } else stopSpeech(); });
$("#bigger").addEventListener("click",()=>{ S.settings.scale = Math.min(1.5, +(S.settings.scale+0.1).toFixed(1)); applyLook(); saveState(); });
$("#smaller").addEventListener("click",()=>{ S.settings.scale = Math.max(0.8, +(S.settings.scale-0.1).toFixed(1)); applyLook(); saveState(); });
document.addEventListener("keydown",e=>{
  if (ui.view !== "quiz" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")) return;
  const c = currentQ(); if (!c) return;
  if (!e.key || e.key.length !== 1 && !["Enter","ArrowRight"].includes(e.key)) return;
  const k = e.key.toUpperCase();
  const i = LETTERS.indexOf(k) >= 0 ? LETTERS.indexOf(k) : ("12345".indexOf(e.key));
  if (i >= 0 && i < c.q.choices.length && S.session.picks[c.q.id] == null){ e.preventDefault(); choose(i); }
  else if ((e.key === "Enter" || e.key === "ArrowRight") && S.session.picks[c.q.id] != null){ e.preventDefault(); next(); }
  else if (k === "R"){ speak(questionSpeech(c.q), true); }
});

/* ---------- boot ---------- */
try { const look = JSON.parse(localStorage.getItem("mbt-look")||"null"); if (look){ S.settings.theme = look.theme ?? null; S.settings.scale = look.scale || 1; } } catch(e){}
applyLook(); render();
async function ensureSample(){
  if (sample || OFFLINE || SERVER) return sample;
  if (ensureSample.p) return ensureSample.p;
  ensureSample.p = (async () => {
    try { if (window.claude?.use){ const s = await claude.use("sample"); if (s) sample = s; } } catch(e){}
    sampleState = sample ? "ready" : "none"; ensureSample.p = null;
    if (ui.view==="import" || ui.view==="generate") render();
    return sample;
  })();
  return ensureSample.p;
}
ensureSample();
(async () => {
  await Store.init();
  if (SERVER && !Srv.token){ ui.view = "login"; loaded = true; render(); return; }
  let st, bl, fg;
  try { ({st, bl, fg} = await Store.load()); }
  catch(e){ if (SERVER){ if (e?.code !== "signed_out"){ ui.view = "login"; ui.loginErr = "Couldn't reach your server. Check your connection, then sign in again."; loaded = true; render(); } return; } throw e; }
  figs = fg || {};
  if (st){
    const old = st.settings || {};
    if (old.v !== 2){ old.sound = true; old.flow = "manual"; old.readPassages = true; old.v = 2; }
    S = {...S, ...st, settings:{...S.settings, ...old}};
  }
  blocks = bl || {};
  // files that were being read when the page closed go back to "ready"
  for (const r of fileRecs()) if (r.status === "reading") r.status = "new";
  try { cachedIds = new Set(await IDB.keys("files") || []); } catch(e){}
  if (OFFLINE){
    try { const bank = JSON.parse(document.getElementById("mbt-bank")?.textContent || "null"); if (bank) mergeBank(bank, true); } catch(e){}
  }
  loaded = true; applyLook(); render();
})();
